# ─────────────────────────────────────────────────────────
# Production Docker Compose
#
# All stateful services run on managed external providers:
#   MongoDB    → Atlas     (MONGO_URI_*)
#   PostgreSQL → Neon      (ORDER_DATABASE_URL, PAYMENT_DATABASE_URL)
#   Redis      → Upstash   (UPSTASH_REDIS_URL)
#   RabbitMQ   → CloudAMQP (CLOUDAMQP_URL)
#
# Only stateless application services run here.
# ─────────────────────────────────────────────────────────

services:
  # ─── API Gateway ────────────────────────────────────────
  gateway:
    image: ${GHCR_REPO}/gateway:latest
    container_name: ecommerce-gateway
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://127.0.0.1:80/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - ecommerce-network

  # ─── Microservices ───────────────────────────────────────
  user-service:
    image: ${GHCR_REPO}/user-service:latest
    container_name: ecommerce-user-service
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI_USER}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${CLOUDAMQP_URL}
    healthcheck:
      test: wget -qO- http://127.0.0.1:3001/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  product-service:
    image: ${GHCR_REPO}/product-service:latest
    container_name: ecommerce-product-service
    restart: unless-stopped
    environment:
      PORT: 3002
      MONGO_URI: ${MONGO_URI_PRODUCT}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${CLOUDAMQP_URL}
      REDIS_URL: ${UPSTASH_REDIS_URL}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    healthcheck:
      test: wget -qO- http://127.0.0.1:3002/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  cart-service:
    image: ${GHCR_REPO}/cart-service:latest
    container_name: ecommerce-cart-service
    restart: unless-stopped
    environment:
      PORT: 3003
      REDIS_URL: ${UPSTASH_REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${CLOUDAMQP_URL}
      CART_TTL: 259200
    healthcheck:
      test: wget -qO- http://127.0.0.1:3003/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  order-service:
    image: ${GHCR_REPO}/order-service:latest
    container_name: ecommerce-order-service
    restart: unless-stopped
    environment:
      PORT: 3004
      DATABASE_URL: ${ORDER_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${CLOUDAMQP_URL}
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
    healthcheck:
      test: wget -qO- http://127.0.0.1:3004/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  payment-service:
    image: ${GHCR_REPO}/payment-service:latest
    container_name: ecommerce-payment-service
    restart: unless-stopped
    environment:
      PORT: 3005
      DATABASE_URL: ${PAYMENT_DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_URL: ${CLOUDAMQP_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    healthcheck:
      test: wget -qO- http://127.0.0.1:3005/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  notification-service:
    image: ${GHCR_REPO}/notification-service:latest
    container_name: ecommerce-notification-service
    restart: unless-stopped
    environment:
      PORT: 3006
      RABBITMQ_URL: ${CLOUDAMQP_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      FROM_EMAIL: ${FROM_EMAIL}
    healthcheck:
      test: wget -qO- http://127.0.0.1:3006/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  health-service:
    image: ${GHCR_REPO}/health-service:latest
    container_name: ecommerce-health-service
    restart: unless-stopped
    environment:
      PORT: 3007
    depends_on:
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      cart-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: wget -qO- http://127.0.0.1:3007/health || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - ecommerce-network

  # ─── Tools (on-demand only) ──────────────────────────────
  seed:
    image: ${GHCR_REPO}/seed:latest
    container_name: ecommerce-seed
    profiles: [tools]
    environment:
      MONGO_URI: ${MONGO_URI_SEED}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@Ecom2026!}
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
