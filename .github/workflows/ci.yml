name: CI

# ─── When does this run? ────────────────────────────────
# On every pull request targeting develop or main.
# This catches bugs BEFORE code reaches staging or production.
on:
  pull_request:
    branches: [develop, main]

# ─── Permissions ─────────────────────────────────────────
# Minimal permissions — CI only reads code, it doesn't push.
permissions:
  contents: read

jobs:
  # ─── Job 1: TypeScript Compilation ─────────────────────
  # WHY: Catches type errors across all services + shared package.
  # This is the fastest check — if types are broken, nothing else matters.
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install all workspace dependencies (shared + all services)
      - name: Install dependencies
        run: npm ci

      # Generate Prisma clients — needed before TypeScript can compile
      # order-service and payment-service import from @prisma/order-client
      # and @prisma/payment-client, which don't exist until generated.
      - name: Generate Prisma clients
        run: npm run prisma:generate

      # --build compiles all projects in dependency order:
      # shared → services (since services depend on shared via project references)
      - name: Compile TypeScript
        run: npx tsc --build

  # ─── Job 2: Unit + Integration Tests ────────────────────
  # WHY: Runs all Vitest tests (unit + integration) with coverage.
  # Coverage thresholds are set in vitest.config.ts (80% statements,
  # 80% functions, 80% lines, 70% branches). If coverage drops
  # below these thresholds, the job fails — blocking the PR.
  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Prisma clients are needed for order-service and payment-service
      # tests to resolve imports correctly
      - name: Generate Prisma clients
        run: npm run prisma:generate

      - name: Build shared package
        run: npm run build --workspace=shared

      # Run all tests with coverage — exits non-zero if:
      # 1. Any test fails, OR
      # 2. Coverage drops below thresholds in vitest.config.ts
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          JWT_SECRET: b653704716e555b5849ace3716d24ca1deb45aa06976bf3989d9974d63147a0f

  # ─── Job 3: Docker Build Verification ──────────────────
  # WHY: Ensures every service's Dockerfile builds successfully.
  # A passing typecheck doesn't guarantee Docker builds work —
  # Dockerfiles have their own COPY, RUN, and dependency steps
  # that can break independently.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    # Don't waste CI minutes if types or tests are broken
    needs: [typecheck, test]

    strategy:
      # Build all services in parallel for speed
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service
          - health-service
          - gateway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Build the Docker image but don't push — just verify it compiles.
      # --load imports it into the local Docker daemon so we can test it.
      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          # Gateway Dockerfile lives at gateway/Dockerfile, not services/gateway/
          file: ${{ matrix.service == 'gateway' && 'gateway/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          push: false
          load: true
          tags: ecommerce/${{ matrix.service }}:test

  # ─── Job 4: Integration Smoke Test ─────────────────────
  # WHY: Verifies services actually START and respond to health checks.
  # A Docker image can build fine but crash on startup (missing env vars,
  # bad imports, database connection issues). This catches those.
  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: docker-build
    env:
      JWT_SECRET: b653704716e555b5849ace3716d24ca1deb45aa06976bf3989d9974d63147a0f
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: ""
      CLIENT_URL: http://localhost:3000
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Start all containers. --wait uses Docker healthchecks to block
      # until every service reports healthy. No manual sleep needed —
      # healthchecks in docker-compose.yml handle the timing.
      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build --wait --wait-timeout 120

      # Verify all containers are healthy and gateway responds
      - name: Run health checks
        run: bash scripts/health-check.sh

      # If anything failed, dump logs so we can debug in the GitHub Actions UI
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail=50
