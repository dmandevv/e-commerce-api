name: CD Staging

# ─── When does this run? ────────────────────────────────
# On every push to develop (after a PR merge).
# develop = staging. main = production.
on:
  push:
    branches: [develop]

permissions:
  contents: read
  packages: write

jobs:
  # ─── Build and Push :staging images ────────────────────
  # WHY: We tag images with :staging (not :latest or :sha).
  # Staging always runs the latest develop commit — no need
  # for SHA pinning since we don't roll back staging.
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service
          - health-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.service }}:staging
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache,mode=max

  # ─── Deploy to ecommerce-staging namespace ─────────────
  # WHY kubectl apply -k on every deploy:
  # The first deploy creates the namespace and all resources.
  # Subsequent deploys are idempotent — only changed resources
  # are updated. Then we restart pods so they pull :staging
  # (same tag, new image content).
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /tmp && rm -rf e-commerce-api-staging
            git clone https://github.com/dmandevv/e-commerce-api.git \
              --branch develop --depth 1 e-commerce-api-staging
            cd e-commerce-api-staging

            # Apply all staging manifests (creates namespace/services if
            # they don't exist, updates configmap/ingress if they changed)
            kubectl apply -k k8s/staging/

            # Restart all deployments so pods pull the new :staging image.
            # RollingUpdate strategy ensures zero downtime (maxUnavailable: 0).
            for SVC in user-service product-service cart-service order-service \
                       payment-service notification-service health-service; do
              kubectl rollout restart deployment/$SVC -n ecommerce-staging
            done

            # Wait for all rollouts to complete
            for SVC in user-service product-service cart-service order-service \
                       payment-service notification-service health-service; do
              kubectl rollout status deployment/$SVC \
                -n ecommerce-staging --timeout=120s
            done

            rm -rf /tmp/e-commerce-api-staging

  # ─── Smoke test against live staging cluster ───────────
  # Runs after pods are confirmed healthy. Walks the full
  # happy path: health → auth → products → cart → orders.
  # Fails the pipeline (and notifies via GitHub) if staging
  # is broken after a deploy.
  smoke-test:
    name: Smoke Test Staging
    runs-on: ubuntu-latest
    needs: deploy-staging

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke test
        env:
          SERVER_IP: ${{ secrets.DEPLOY_HOST }}
        run: |
          chmod +x scripts/smoke-test-staging.sh
          ./scripts/smoke-test-staging.sh "$SERVER_IP"
