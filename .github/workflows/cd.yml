name: CD

# ─── When does this run? ────────────────────────────────
# Only when code is pushed to main (after a PR merge).
# This is the deployment trigger — main = production.
on:
  push:
    branches: [main]

# ─── Permissions ─────────────────────────────────────────
# packages: write — needed to push Docker images to GHCR
# contents: read  — needed to checkout code
permissions:
  contents: read
  packages: write

jobs:
  # ─── Build and Push Docker Images ──────────────────────
  # WHY: After code passes CI and lands on main, we build
  # production-ready Docker images and push them to GitHub
  # Container Registry (ghcr.io). Any deployment target
  # (cloud server, Kubernetes, etc.) pulls from here.
  build-and-push:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - user-service
          - product-service
          - cart-service
          - order-service
          - payment-service
          - notification-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Docker Buildx ──────────────────────────────────
      # WHY: Buildx is Docker's extended builder. It supports
      # multi-platform builds and better layer caching.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ─── Authenticate with GHCR ─────────────────────────
      # WHY: GHCR requires authentication to push images.
      # GITHUB_TOKEN is automatically provided by GitHub Actions —
      # no secrets to configure manually.
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─── Extract metadata for tags ──────────────────────
      # WHY: We tag images with both:
      #   - The git SHA (immutable, for rollbacks: "deploy sha abc123")
      #   - "latest" (convenience, for docker compose pull)
      # This way you always know exactly which commit is running.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      # ─── Build and Push ─────────────────────────────────
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers in GHCR to speed up subsequent builds.
          # First build is slow, but after that only changed layers rebuild.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/${{ matrix.service }}:buildcache,mode=max

  # ─── Deploy to DigitalOcean ──────────────────────────────
  # WHY a separate job? This runs AFTER all 6 images are built
  # and pushed. "needs: build-and-push" ensures we don't deploy
  # until every image is ready.
  #
  # HOW: SSH into the Droplet, pull the latest images, and
  # restart containers. Zero-downtime isn't the goal here —
  # the restart takes ~30 seconds. For a portfolio project
  # that's fine. Real stores use rolling deploys (Kubernetes).
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ─── Sync deployment files to server ───────────────────
      # WHY: The server needs docker-compose.prod.yml and
      # nginx.conf to run. We copy them from the repo so the
      # server always has the version that matches the code.
      # The .env file is NOT copied — it lives only on the
      # server and contains production secrets.
      - name: Copy files to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,gateway/nginx.prod.conf"
          target: ~/ecommerce

      # ─── SSH and Deploy ──────────────────────────────────
      # WHY appleboy/ssh-action? It handles SSH key setup,
      # known_hosts, and connection management. Saves ~15 lines
      # of manual SSH config.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/ecommerce

            # Pull the latest images from GHCR
            docker compose -f docker-compose.prod.yml pull

            # Restart with new images, remove orphaned containers
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Clean up old images to save disk space
            docker image prune -f
