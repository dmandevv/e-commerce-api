# ─── Input: tail Docker's JSON log files ────────────────────
# Docker writes every container's stdout/stderr to JSON files at:
#   /var/lib/docker/containers/<id>/<id>-json.log
#
# Each line in these files looks like:
#   {"log":"Order service running on port 3004\n","stream":"stdout","time":"..."}
#
# The glob pattern (**) matches all container IDs. Fluentd watches
# for new lines (like `tail -f`) and reads them as they appear.
# pos_file tracks how far Fluentd has read in each file, so it
# doesn't re-read old logs after a restart.
<source>
  @type tail
  path /var/lib/docker/containers/**/*-json.log
  pos_file /fluentd/log/docker.pos
  tag docker.*
  read_from_head true
  <parse>
    @type json
    time_key time
    time_format %Y-%m-%dT%H:%M:%S.%NZ
  </parse>
</source>

# ─── Filter: try to parse JSON from the log field ───────────
# Our services log structured data via console.log(). Docker
# wraps it in a "log" field. This filter attempts to parse that
# inner JSON so fields like "service", "method", "path" become
# searchable in Kibana. If the log line isn't valid JSON (e.g.,
# a plain string message), it passes through unchanged.
<filter docker.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# ─── Output: send to Elasticsearch ──────────────────────────
# logstash_format: true — indexes by day (fluentd-2026.03.25)
#   so old logs can be easily deleted with index lifecycle policies.
# flush_interval: 5s — batches logs and sends every 5 seconds
#   instead of one-by-one (reduces Elasticsearch load).
# include_tag_key: true — adds the tag as a field so you can
#   filter by container in Kibana.
<match docker.**>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix fluentd
  include_tag_key true
  tag_key container_name
  flush_interval 5s
</match>
