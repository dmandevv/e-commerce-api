# Tells Grafana to load dashboard JSON files from the /dashboards directory.
# On startup, Grafana scans this path and imports any .json files as dashboards.
apiVersion: 1

providers:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30   # Re-scan for changes every 30s
    options:
      path: /var/lib/grafana/dashboards
