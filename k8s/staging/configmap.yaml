apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce-staging
data:
  # Service ports (same as production)
  USER_SERVICE_PORT: "3001"
  PRODUCT_SERVICE_PORT: "3002"
  CART_SERVICE_PORT: "3003"
  ORDER_SERVICE_PORT: "3004"
  PAYMENT_SERVICE_PORT: "3005"
  NOTIFICATION_SERVICE_PORT: "3006"
  HEALTH_SERVICE_PORT: "3007"

  # Inter-service URLs — uses ecommerce-staging namespace DNS
  # Format: http://<service-name>.<namespace>.svc.cluster.local:<port>
  # The short form (http://product-service:3002) also works when pods
  # are in the same namespace, which they are here.
  PRODUCT_SERVICE_URL: "http://product-service:3002"
  CART_SERVICE_URL: "http://cart-service:3003"

  # Non-secret config
  CART_TTL: "259200"
  SMTP_PORT: "587"
  CLIENT_URL: "http://staging.dmandevv.shop:8080"
