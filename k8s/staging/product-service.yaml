apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: ecommerce-staging
  labels:
    app: product-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: product-service
          image: ghcr.io/dmandevv/e-commerce-api/product-service:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 3002
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PRODUCT_SERVICE_PORT
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: MONGODB_URI_PRODUCT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: RABBITMQ_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: REDIS_URL
            - name: CLOUDINARY_CLOUD_NAME
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: CLOUDINARY_CLOUD_NAME
            - name: CLOUDINARY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: CLOUDINARY_API_KEY
            - name: CLOUDINARY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: CLOUDINARY_API_SECRET
          resources:
            requests:
              cpu: 30m
              memory: 80Mi
            limits:
              cpu: 150m
              memory: 160Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: ecommerce-staging
spec:
  type: ClusterIP
  selector:
    app: product-service
  ports:
    - port: 3002
      targetPort: 3002
