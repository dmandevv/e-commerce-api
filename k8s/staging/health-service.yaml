apiVersion: apps/v1
kind: Deployment
metadata:
  name: health-service
  namespace: ecommerce-staging
  labels:
    app: health-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: health-service
  template:
    metadata:
      labels:
        app: health-service
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: health-service
          image: ghcr.io/dmandevv/e-commerce-api/health-service:staging
          ports:
            - containerPort: 3007
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: HEALTH_SERVICE_PORT
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: JWT_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 30Mi
            limits:
              cpu: 50m
              memory: 60Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: health-service
  namespace: ecommerce-staging
spec:
  type: ClusterIP
  selector:
    app: health-service
  ports:
    - port: 3007
      targetPort: 3007
