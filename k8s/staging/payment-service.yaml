apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecommerce-staging
  labels:
    app: payment-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: payment-service
          image: ghcr.io/dmandevv/e-commerce-api/payment-service:staging
          imagePullPolicy: Always
          ports:
            - containerPort: 3005
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: PAYMENT_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: PAYMENT_DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: JWT_SECRET
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: RABBITMQ_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: STRIPE_WEBHOOK_SECRET
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: REDIS_URL
          resources:
            requests:
              cpu: 30m
              memory: 80Mi
            limits:
              cpu: 150m
              memory: 160Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 35
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecommerce-staging
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - port: 3005
      targetPort: 3005
