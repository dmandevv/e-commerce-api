# ─────────────────────────────────────────────────────────
# Staging Secret Template (PLACEHOLDER VALUES ONLY)
#
# Create the actual secret on the server:
#
#   kubectl create secret generic ecommerce-staging-secrets \
#     --namespace=ecommerce-staging \
#     --from-literal=MONGODB_URI_USER='mongodb+srv://...' \
#     --from-literal=MONGODB_URI_PRODUCT='mongodb+srv://...' \
#     --from-literal=ORDER_DATABASE_URL='postgresql://...' \
#     --from-literal=PAYMENT_DATABASE_URL='postgresql://...' \
#     --from-literal=REDIS_URL='redis://...' \
#     --from-literal=RABBITMQ_URL='amqps://...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=STRIPE_SECRET_KEY='sk_test_...' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='whsec_...' \
#     --from-literal=CLOUDINARY_CLOUD_NAME='...' \
#     --from-literal=CLOUDINARY_API_KEY='...' \
#     --from-literal=CLOUDINARY_API_SECRET='...'
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-staging-secrets
  namespace: ecommerce-staging
type: Opaque
stringData:
  MONGODB_URI_USER: "PLACEHOLDER"
  MONGODB_URI_PRODUCT: "PLACEHOLDER"
  ORDER_DATABASE_URL: "PLACEHOLDER"
  PAYMENT_DATABASE_URL: "PLACEHOLDER"
  REDIS_URL: "PLACEHOLDER"
  RABBITMQ_URL: "PLACEHOLDER"
  JWT_SECRET: "PLACEHOLDER"
  STRIPE_SECRET_KEY: "PLACEHOLDER"
  STRIPE_WEBHOOK_SECRET: "PLACEHOLDER"
  CLOUDINARY_CLOUD_NAME: "PLACEHOLDER"
  CLOUDINARY_API_KEY: "PLACEHOLDER"
  CLOUDINARY_API_SECRET: "PLACEHOLDER"
