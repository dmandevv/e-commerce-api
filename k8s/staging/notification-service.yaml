apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: ecommerce-staging
  labels:
    app: notification-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
        - name: ghcr-regcred
      containers:
        - name: notification-service
          image: ghcr.io/dmandevv/e-commerce-api/notification-service:staging
          ports:
            - containerPort: 3006
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: NOTIFICATION_SERVICE_PORT
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: RABBITMQ_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ecommerce-staging-secrets
                  key: JWT_SECRET
            - name: CLIENT_URL
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: CLIENT_URL
            - name: SMTP_PORT
              valueFrom:
                configMapKeyRef:
                  name: ecommerce-config
                  key: SMTP_PORT
          resources:
            requests:
              cpu: 20m
              memory: 40Mi
            limits:
              cpu: 100m
              memory: 80Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3006
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: ecommerce-staging
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - port: 3006
      targetPort: 3006
