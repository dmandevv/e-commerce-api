# ─────────────────────────────────────────────────────────
# Traefik Middleware — CORS, Rate Limiting
#
# Replaces the NGINX rate_limit_zone and add_header blocks
# from gateway/nginx.prod.conf.
# ─────────────────────────────────────────────────────────

# CORS headers for the Vercel frontend
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: cors-headers
  namespace: ecommerce
spec:
  headers:
    accessControlAllowOriginList:
      - "https://dmandevv.shop"
      - "https://www.dmandevv.shop"
    accessControlAllowMethods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    accessControlAllowHeaders:
      - Authorization
      - Content-Type
    accessControlMaxAge: 86400
    addVaryHeader: true
---
# General API rate limit: 30 req/s average, burst of 20
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-api
  namespace: ecommerce
spec:
  rateLimit:
    average: 30
    burst: 20
---
# Auth rate limit: 5 req/min average, burst of 3
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit-auth
  namespace: ecommerce
spec:
  rateLimit:
    average: 5
    period: 1m
    burst: 3
