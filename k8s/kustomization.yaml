apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecommerce

resources:
  # Base
  - base/namespace.yaml
  - base/configmap.yaml

  # Services
  - services/user-service.yaml
  - services/product-service.yaml
  - services/cart-service.yaml
  - services/order-service.yaml
  - services/payment-service.yaml
  - services/notification-service.yaml
  - services/health-service.yaml

  # Ingress
  - ingress/middleware.yaml
  - ingress/ingress.yaml
