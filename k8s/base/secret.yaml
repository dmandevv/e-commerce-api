# ─────────────────────────────────────────────────────────
# Secret Template (PLACEHOLDER VALUES ONLY)
#
# Do NOT commit real credentials. Create the actual secret
# on the server:
#
#   kubectl create secret generic ecommerce-secrets \
#     --namespace=ecommerce \
#     --from-literal=MONGODB_URI='...' \
#     --from-literal=MONGODB_URI_USER='...' \
#     --from-literal=MONGODB_URI_PRODUCT='...' \
#     --from-literal=ORDER_DATABASE_URL='...' \
#     --from-literal=PAYMENT_DATABASE_URL='...' \
#     --from-literal=REDIS_URL='...' \
#     --from-literal=RABBITMQ_URL='...' \
#     --from-literal=JWT_SECRET='...' \
#     --from-literal=STRIPE_SECRET_KEY='...' \
#     --from-literal=STRIPE_WEBHOOK_SECRET='...' \
#     --from-literal=CLOUDINARY_CLOUD_NAME='...' \
#     --from-literal=CLOUDINARY_API_KEY='...' \
#     --from-literal=CLOUDINARY_API_SECRET='...' \
#     --from-literal=SMTP_HOST='...' \
#     --from-literal=SMTP_USER='...' \
#     --from-literal=SMTP_PASS='...' \
#     --from-literal=SMTP_FROM='...' \
#     --from-literal=ADMIN_PASSWORD='...'
# ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
type: Opaque
stringData:
  # MongoDB Atlas
  MONGODB_URI: "PLACEHOLDER"
  MONGODB_URI_USER: "PLACEHOLDER"
  MONGODB_URI_PRODUCT: "PLACEHOLDER"

  # Neon PostgreSQL
  ORDER_DATABASE_URL: "PLACEHOLDER"
  PAYMENT_DATABASE_URL: "PLACEHOLDER"

  # Upstash Redis
  REDIS_URL: "PLACEHOLDER"

  # CloudAMQP RabbitMQ
  RABBITMQ_URL: "PLACEHOLDER"

  # Auth
  JWT_SECRET: "PLACEHOLDER"

  # Stripe
  STRIPE_SECRET_KEY: "PLACEHOLDER"
  STRIPE_WEBHOOK_SECRET: "PLACEHOLDER"

  # Cloudinary
  CLOUDINARY_CLOUD_NAME: "PLACEHOLDER"
  CLOUDINARY_API_KEY: "PLACEHOLDER"
  CLOUDINARY_API_SECRET: "PLACEHOLDER"

  # Email
  SMTP_HOST: "PLACEHOLDER"
  SMTP_USER: "PLACEHOLDER"
  SMTP_PASS: "PLACEHOLDER"
  SMTP_FROM: "PLACEHOLDER"

  # Seed
  ADMIN_PASSWORD: "PLACEHOLDER"
